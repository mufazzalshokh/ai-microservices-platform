services:

  # ── Infrastructure ────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application services ──────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    secrets:
      - jwt_public_key
      - jwt_private_key
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ALGORITHM: RS256
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ai-platform}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://localhost:8000/health', timeout=3))['status'] == 'ok'"]
      interval: 15s
      timeout: 5s
      retries: 3

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    secrets:
      - jwt_public_key
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ALGORITHM: RS256
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ai-platform}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      AGENT_MODEL: ${AGENT_MODEL:-gpt-4o-mini}
      MCP_URL: http://mcp-gateway:8003/mcp
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://localhost:8001/health', timeout=3))['status'] == 'ok'"]
      interval: 15s
      timeout: 5s
      retries: 3

  document-service:
    build:
      context: .
      dockerfile: document-service/Dockerfile
    secrets:
      - jwt_public_key
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ALGORITHM: RS256
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ai-platform}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://localhost:8002/health', timeout=3))['status'] == 'ok'"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    profiles: [examples]
    build:
      context: .
      dockerfile: worker-service/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app:celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3

  mcp-gateway:
    build:
      context: .
      dockerfile: mcp-gateway/Dockerfile
    ports:
      - "127.0.0.1:8003:8003"
    secrets:
      - jwt_public_key
    environment:
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ALGORITHM: RS256
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ai-platform}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-http://localhost/mcp}
      DOCUMENT_SERVICE_URL: http://document-service:8002
    depends_on:
      document-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://localhost:8003/health', timeout=3))['status'] == 'ok'"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - ai-service
      - document-service
      - mcp-gateway

volumes:
  postgres_data:
  redis_data:

secrets:
  jwt_private_key:
    file: ${JWT_PRIVATE_KEY_PATH:-./keys/jwt-private.pem}
  jwt_public_key:
    file: ${JWT_PUBLIC_KEY_PATH:-./keys/jwt-public.pem}
