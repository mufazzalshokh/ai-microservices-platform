events {
    worker_connections 1024;
}

http {
    upstream auth_service { server api-gateway:8000; }
    upstream ai_service { server ai-service:8001; }
    upstream document_service { server document-service:8002; }
    upstream mcp_service { server mcp-gateway:8003; }

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name _;
        client_max_body_size 11m;
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;

        location /api/v1/auth/ { proxy_pass http://auth_service; }
        location /api/v1/inference/ { proxy_pass http://ai_service; }
        location /api/v1/agent/ { proxy_pass http://ai_service; }
        location /api/v1/documents/ { proxy_pass http://document_service; }
        location = /api/v1/documents { return 308 /api/v1/documents/; }
        location = /mcp { proxy_pass http://mcp_service; }
        location /.well-known/oauth-protected-resource/ { proxy_pass http://mcp_service; }
        location = /.well-known/jwks.json { proxy_pass http://auth_service; }
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location / { proxy_pass http://auth_service; }
    }
}
